[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "atlantide"
dynamic = ["version"]
description = "Typed Python IaC engine: deterministic Atlas-lang config, graph state, parallel reconciliation"
readme = "README.md"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
requires-python = ">=3.12"
keywords = [
    "infrastructure-as-code", "iac", "aws", "terraform", "pulumi",
    "devops", "cloud", "provisioning", "deterministic",
]
# Classifiers drive PyPI's browse facets. "4 - Beta" refers to stability, not
# completeness: the state format has a versioned forward migration, but can
# still change between minor releases.
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Software Development :: Build Tools",
    "Topic :: System :: Installation/Setup",
    "Topic :: System :: Systems Administration",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.7",
    "typer>=0.12",
    "rich>=13",
    "returns>=0.23",
    "boto3>=1.34",
    "cryptography>=42",
]

[project.urls]
Homepage = "https://github.com/atlantide-org/atlantide"
Documentation = "https://atlantide-org.github.io/"
Repository = "https://github.com/atlantide-org/atlantide"
# The releases page, not a CHANGELOG.md: `release.yml` cuts a GitHub Release for
# every `v*` tag, so it needs no upkeep.
Changelog = "https://github.com/atlantide-org/atlantide/releases"
Issues = "https://github.com/atlantide-org/atlantide/issues"

# Built-in providers use the same entry-point discovery as third-party ones, so
# the shipped providers exercise the plugin path.
[project.entry-points."atlantide.providers"]
aws = "atlantide.providers.aws:PLUGIN"
local = "atlantide.providers.local:PLUGIN"
random = "atlantide.providers.random:PLUGIN"

[project.scripts]
atlantide = "atlantide.cli.main:main"

[project.optional-dependencies]
build = ["pyinstaller>=6.6"]
postgres = ["psycopg[binary]>=3.1"]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5",
    "hypothesis>=6",
    "mypy>=1.10",
    "ruff>=0.5",
    "import-linter>=2",
    "moto>=5",
    "boto3-stubs[s3]>=1.34",
    "pre-commit>=3",
    "testcontainers[postgres]>=4.8",
]

# The one place the version is written: hatch reads `__version__` from the
# package, so the built metadata and a source-tree `--version` cannot disagree.
[tool.hatch.version]
path = "atlantide/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["atlantide"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["atlantide"]
plugins = ["returns.contrib.mypy.returns_plugin"]

# Beyond `strict`, which leaves these off by default.
#
# `warn_unreachable` and `extra_checks` catch changes that otherwise land
# silently: a narrowed branch that can no longer be entered, and a
# variance/TypedDict mistake that only shows up at a distant call site.
warn_unreachable = true
extra_checks = true

# `truthy-bool`: a `Result` has no `__bool__`, so `if not result:` is always
#   false and the error branch behind it is dead. Review and happy-path tests
#   miss it; the failure surfaces as `unwrap`'s bare `UnwrapFailedError`.
# `explicit-override` makes a subclass declare that it overrides, so renaming a
#   base method turns every stale subclass into an error instead of an uncalled
#   method. Across many provider handlers, this guards against silently lost
#   behaviour.
# `possibly-undefined`, `truthy-iterable` and `ignore-without-code` keep the
#   package clean of those errors.
#
# Not enabled:
# `redundant-expr` — every hit is a defensive `isinstance` guarding a value that
#   arrives from an untyped source (config evaluation, a state file). The
#   annotation states the intended contract; the guard enforces it at runtime.
#   Silencing it would mean widening those signatures and losing the contract.
# `mutable-override` — handler subclasses narrow `resource_type` from
#   `ClassVar[type[Resource]]` to their own type, which is the whole point of the
#   handler being generic over one resource.
# `unused-awaitable` — fires on `tg.create_task(...)` inside `async with
#   asyncio.TaskGroup()`, where the group awaits the task.
enable_error_code = [
    "explicit-override",
    "ignore-without-code",
    "possibly-undefined",
    "truthy-bool",
    "truthy-iterable",
]

# psycopg ships with the optional `postgres` extra; the backend that imports it
# guards the import and treats the driver as untyped either way.
[[tool.mypy.overrides]]
module = ["psycopg", "psycopg.*"]
ignore_missing_imports = true

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E", "F", "W", "I", "UP", "B", "SIM", "RUF",
    "FBT", "PT", "ERA", "PERF", "TC", "C90", "PLR0913",
]
ignore = [
    # `assert a and b`: 117 test sites; splitting them is churn for little gain.
    "PT018",
    # Moving typing-only imports under `if TYPE_CHECKING:` (590 sites): heavy imports
    # are already deferred where it matters, and pydantic, Typer and dataclass
    # evaluation need many of these names at runtime.
    "TC001",
    "TC002",
    "TC003",
]

[tool.ruff.lint.per-file-ignores]
# Typer declares every CLI option as a defaulted parameter of the command function;
# Typer passes them by name, so a `bool` option default is not a positional flag.
"atlantide/cli/app.py" = ["FBT002"]
"atlantide/cli/commands/**" = ["FBT002"]
# pytest and hypothesis inject test parameters by name; a boolean literal in a test
# is often the value under test (`to_canonical_json(True)`).
"tests/**/test_*.py" = ["FBT001", "FBT003"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-args = 7

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--cov=atlantide --cov-report=term-missing --cov-fail-under=90"

[tool.coverage.run]
source = ["atlantide"]

[tool.importlinter]
root_package = "atlantide"

[[tool.importlinter.contracts]]
name = "layered architecture"
type = "layers"
layers = [
    # `testing` is the public test API for component authors: an entrypoint like
    # the CLI, and independent of it.
    "atlantide.cli | atlantide.testing",
    "atlantide.engine",
    "atlantide.reconcile",
    "atlantide.policy | atlantide.providers | atlantide.state | atlantide.secrets | atlantide.lang",
    "atlantide.graph",
    "atlantide.ir",
    "atlantide.util",
    "atlantide.core",
]

# Nothing ships on top of the test API: the engine, the CLI and config-reachable
# packages alike run without it. The layers contract covers the layered packages;
# this one also covers `components`.
[[tool.importlinter.contracts]]
name = "nothing imports testing"
type = "forbidden"
source_modules = [
    "atlantide.cli",
    "atlantide.components",
    "atlantide.core",
    "atlantide.engine",
    "atlantide.graph",
    "atlantide.ir",
    "atlantide.lang",
    "atlantide.policy",
    "atlantide.providers",
    "atlantide.reconcile",
    "atlantide.secrets",
    "atlantide.state",
    "atlantide.util",
]
forbidden_modules = ["atlantide.testing"]

# `util` is shared engine plumbing (AWS client config, owner-only files, the
# project-file lookup). The layers contract keeps everything but `core` from
# being imported by it; this one also covers the packages outside the layers.
[[tool.importlinter.contracts]]
name = "util depends only on core"
type = "forbidden"
source_modules = ["atlantide.util"]
forbidden_modules = [
    "atlantide.cli",
    "atlantide.components",
    "atlantide.engine",
    "atlantide.graph",
    "atlantide.ir",
    "atlantide.lang",
    "atlantide.policy",
    "atlantide.providers",
    "atlantide.reconcile",
    "atlantide.secrets",
    "atlantide.state",
]

[[tool.importlinter.contracts]]
name = "core is a leaf (imports no sibling package)"
type = "forbidden"
source_modules = ["atlantide.core"]
forbidden_modules = [
    "atlantide.lang",
    "atlantide.ir",
    "atlantide.graph",
    "atlantide.state",
    "atlantide.secrets",
    "atlantide.reconcile",
    "atlantide.providers",
    "atlantide.cli",
    "atlantide.engine",
]

[[tool.importlinter.contracts]]
name = "providers depend only on core and util"
type = "forbidden"
source_modules = ["atlantide.providers"]
forbidden_modules = [
    "atlantide.lang",
    "atlantide.ir",
    "atlantide.graph",
    "atlantide.state",
    "atlantide.secrets",
    "atlantide.reconcile",
    "atlantide.cli",
    "atlantide.engine",
]

[[tool.importlinter.contracts]]
name = "secrets depends only on core and util"
type = "forbidden"
source_modules = ["atlantide.secrets"]
forbidden_modules = [
    "atlantide.lang",
    "atlantide.ir",
    "atlantide.graph",
    "atlantide.state",
    "atlantide.reconcile",
    "atlantide.providers",
    "atlantide.cli",
    "atlantide.engine",
]

[[tool.importlinter.contracts]]
name = "components depend only on core and util"
type = "forbidden"
source_modules = ["atlantide.components"]
forbidden_modules = [
    "atlantide.cli",
    "atlantide.engine",
    "atlantide.graph",
    "atlantide.ir",
    "atlantide.lang",
    "atlantide.policy",
    "atlantide.providers",
    "atlantide.reconcile",
    "atlantide.secrets",
    "atlantide.state",
]

# No import cycle between a package and its submodules, or between the resource
# and component models: the components package imports its submodules (lazily,
# in `mount`), and `core.component` types `child` against `Resource`, so the
# reverse edges stay out. The active component prefix lives in the private
# `core._component_prefix`. `as_packages = false` names the modules themselves,
# not their descendants, so `fetch` may still import `components.lock`.
[[tool.importlinter.contracts]]
name = "no import cycles through the components package or core.component"
type = "forbidden"
as_packages = false
source_modules = [
    "atlantide.core.resource",
    "atlantide.components.fetch",
    "atlantide.components.lock",
    "atlantide.components.source",
    "atlantide.components._layout",
]
forbidden_modules = [
    "atlantide.core.component",
    "atlantide.components",
]

# Backends stay swappable behind `StateBackend`: what they share lives in
# `state.{model,leases,fencing,backend,codec}`, never in another backend.
[[tool.importlinter.contracts]]
name = "state backends are independent"
type = "independence"
modules = [
    "atlantide.state.s3",
    "atlantide.state.sql",
    "atlantide.state.memory",
]

# "Everything before the diff is pure": the diff, the modules it is built from
# (the change model, the per-node rules, the upstream verdicts, replace
# ordering) and the prevent_destroy guard never reach the executor, the state
# writer or a storage backend.
[[tool.importlinter.contracts]]
name = "diff and guards are pure"
type = "forbidden"
source_modules = [
    "atlantide.reconcile.changes",
    "atlantide.reconcile.classify",
    "atlantide.reconcile.diff",
    "atlantide.reconcile.guards",
    "atlantide.reconcile.ordering",
    "atlantide.reconcile.upstream",
]
forbidden_modules = [
    "atlantide.reconcile.executor",
    "atlantide.reconcile.writer",
    "atlantide.state.s3",
    "atlantide.state.sql",
]

# Command groups share only the `cli` infrastructure and `cli.views`.
[[tool.importlinter.contracts]]
name = "cli command groups are independent"
type = "independence"
modules = [
    "atlantide.cli.commands.artifact",
    "atlantide.cli.commands.component",
    "atlantide.cli.commands.graph",
    "atlantide.cli.commands.imports",
    "atlantide.cli.commands.init",
    "atlantide.cli.commands.introspect",
    "atlantide.cli.commands.outputs",
    "atlantide.cli.commands.providers",
    "atlantide.cli.commands.run",
    "atlantide.cli.commands.secrets",
    "atlantide.cli.commands.state",
    "atlantide.cli.commands.validate",
]

# The import graph both modules' docstrings describe: the typed-config layer
# sits below the resource and stack model, never on top of it.
[[tool.importlinter.contracts]]
name = "core.config and core._config_types import only core._describe, core.errors and core.node_id"
type = "forbidden"
source_modules = ["atlantide.core.config", "atlantide.core._config_types"]
forbidden_modules = [
    "atlantide.core._tree",
    "atlantide.core.actions",
    "atlantide.core.check",
    "atlantide.core.component",
    "atlantide.core.context",
    "atlantide.core.events",
    "atlantide.core.fields",
    "atlantide.core.inline",
    "atlantide.core.lifecycle",
    "atlantide.core.logging",
    "atlantide.core.markers",
    "atlantide.core.plugin",
    "atlantide.core.policy",
    "atlantide.core.provider",
    "atlantide.core.registry",
    "atlantide.core.resource",
    "atlantide.core.stack",
    "atlantide.core.tuning",
    "atlantide.core.types",
    "atlantide.cli",
    "atlantide.components",
    "atlantide.engine",
    "atlantide.graph",
    "atlantide.ir",
    "atlantide.lang",
    "atlantide.policy",
    "atlantide.providers",
    "atlantide.reconcile",
    "atlantide.secrets",
    "atlantide.state",
    "atlantide.util",
]
