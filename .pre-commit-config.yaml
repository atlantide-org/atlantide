# Local gate mirroring CI (ruff format -> ruff check -> mypy -> import contracts).
# Install once with: uv run pre-commit install
repos:
  - repo: local
    hooks:
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [python]
        require_serial: true
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix
        language: system
        types: [python]
        require_serial: true
      - id: mypy
        name: mypy
        entry: uv run mypy
        language: system
        pass_filenames: false
        always_run: true
      - id: import-linter
        name: import contracts
        entry: uv run lint-imports
        language: system
        pass_filenames: false
        always_run: true
